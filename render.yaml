services:
  - type: web
    name: ai-dialogue-bot
    env: python
    pythonVersion: "3.12"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/bot.db
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FILE
        value: logs/bot.log
    healthCheckPath: /health